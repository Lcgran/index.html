<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Snoop Dogg Castle Kaizo</title>

  <!-- Configuração do PWA Embutida (Manifest) -->
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Snoop%20Dogg%20Castle%20Kaizo%22,%22short_name%22:%22Snoop%20Castle%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22orientation%22:%22landscape%22,%22background_color%22:%22#0b080d%22,%22theme_color%22:%22#0b080d%22,%22icons%22:[{%22src%22:%22data:image/svg+xml;utf8,<svg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20128%20128%27><rect%20width=%27128%27%20height=%27128%27%20fill=%27%25230b080d%27/><circle%20cx=%2764%27%20cy=%2764%27%20r=%2745%27%20fill=%27%252327ae60%27/><circle%20cx=%2764%27%20cy=%2755%27%20r=%2715%27%20fill=%27%25238a5634%27/><rect%20x=%2754%27%20y=%2748%27%20width=%2720%27%20height=%275%27%20fill=%27%2523111%27/></svg>%22,%22sizes%22:%22128x128%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%20maskable%22}]}">

  <style>
    /* Impedir qualquer rolagem, arrasto ou zoom acidental no celular */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* Desativa gestos nativos do navegador */
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0b080d;
      overflow: hidden;
      font-family: Arial, sans-serif;
      position: fixed; /* Força o travamento da viewport */
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      image-rendering: auto;
    }
    /* Controles de Toque Otimizados para Movimentação Fluida */
    .touch-ui {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 32px;
      pointer-events: none;
    }
    .btn-group {
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 68px;
      height: 68px;
      background: rgba(30, 25, 40, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.6);
      user-select: none;
    }
    .touch-btn:active, .touch-btn.pressed {
      background: rgba(46, 139, 87, 0.95);
      border-color: #2ed573;
      transform: scale(0.9);
    }
    .touch-btn.jump {
      background: rgba(40, 110, 45, 0.8);
    }
    .touch-btn.action {
      background: rgba(180, 120, 20, 0.8);
      font-size: 13px;
    }
    /* Botão PWA de Instalação */
    #install-btn {
      display: none;
      position: absolute;
      top: 15px;
      right: 15px;
      background: #27ae60;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 10;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <button id="install-btn">BAIXAR JOGO 📥</button>
    <canvas id="canvas" width="800" height="600"></canvas>

    <div class="touch-ui">
      <!-- Botões de Movimento -->
      <div class="btn-group">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div class="touch-btn" id="btn-right">▶</div>
      </div>
      <!-- Botões de Ação -->
      <div class="btn-group">
        <div class="touch-btn action" id="btn-space">POSE</div>
        <div class="touch-btn jump" id="btn-jump">▲</div>
      </div>
    </div>
  </div>

  <script>
    // --- Registro do Service Worker para Instalação e Funcionamento Offline ---
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'snoop-castle-cache';
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./'])));
        });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(response => response || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }

    // Gerenciador do Pop-up de Baixar/Instalar
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          installBtn.style.display = 'none';
          deferredPrompt = null;
        });
      }
    });

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Desativa de forma agressiva toques involuntários, zooms de duplo toque e arrastos de tela
    document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart', e => e.preventDefault());

    // --- Audio Web API Procedural ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startDarkMusic();
      }
    }

    function playTone(freqStart, freqEnd, dur, type="sine") {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + dur);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function sfxJump() { playTone(260, 520, 0.15, "sine"); }
    function sfxCoin() { playTone(987, 1318, 0.2, "square"); }
    function sfxStomp() { playTone(180, 70, 0.15, "square"); }
    function sfxTrap() { playTone(400, 90, 0.3, "square"); }
    function sfxShoot() { playTone(500, 150, 0.1, "square"); }

    function startDarkMusic() {
      const bpm = 135;
      const stepDur = (60.0 / bpm) / 2.0;
      const bassNotes = [65.41, 65.41, 77.78, 65.41, 92.5, 65.41, 69.30, 65.41, 65.41, 65.41, 77.78, 65.41, 98.0, 92.5, 77.78, 69.30];
      const leadNotes = [261.63, 311.13, 369.99, 311.13, 261.63, 369.99, 392.00, 311.13, 261.63, 246.94, 261.63, 311.13, 369.99, 311.13, 277.18, 261.63];
      let step = 0;

      setInterval(() => {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const oscB = audioCtx.createOscillator();
        const gainB = audioCtx.createGain();
        oscB.type = "square";
        oscB.frequency.setValueAtTime(bassNotes[step % bassNotes.length], now);
        gainB.gain.setValueAtTime(0.08, now);
        gainB.gain.linearRampToValueAtTime(0.01, now + stepDur * 0.9);
        oscB.connect(gainB); gainB.connect(audioCtx.destination);
        oscB.start(now); oscB.stop(now + stepDur);

        const oscL = audioCtx.createOscillator();
        const gainL = audioCtx.createGain();
        oscL.type = "triangle";
        oscL.frequency.setValueAtTime(leadNotes[step % leadNotes.length], now);
        gainL.gain.setValueAtTime(0.06, now);
        gainL.gain.linearRampToValueAtTime(0.005, now + stepDur * 0.9);
        oscL.connect(gainL); gainL.connect(audioCtx.destination);
        oscL.start(now); oscL.stop(now + stepDur);

        step++;
      }, stepDur * 1000);
    }

    // --- Física e Nível ---
    const GRAVITY = 1350.0;
    const JUMP_STRENGTH = -540.0;
    const ACCEL = 1600.0;
    const FRICTION = 11.0;
    const MAX_SPEED = 300.0;
    const groundY = 550;
    const LEVEL_WIDTH = 3800;

    let cameraX = 0;
    let playerX = 70;
    let playerY = groundY;
    let playerVx = 0;
    let playerVy = 0;
    let isGrounded = true;
    let coyoteTimer = 0;
    let facingRight = true;
    let isCrouching = false;
    let isFacingFront = false;
    let walkTimer = 0;
    let deathRotation = 0;
    let deathTimer = 0;
    let score = 0;
    let coinsCollected = 0;
    let deathCount = 0;
    let gameOver = false;
    let gameWon = false;

    // Cenário e Armadilhas
    const platforms = [
      { x: 0, y: groundY, w: 330, h: 50, type: 'ground' },
      { x: 400, y: groundY, w: 160, h: 50, type: 'ground' },
      { x: 540, y: 450, w: 90, h: 20, type: 'brick' },
      { x: 670, y: 380, w: 85, h: 20, type: 'brick' },
      { x: 800, y: 440, w: 85, h: 20, type: 'falling', origY: 440, vy: 0, triggered: false },
      { x: 930, y: groundY, w: 680, h: 50, type: 'ground' },
      { x: 1080, y: groundY - 110, w: 130, h: 20, type: 'brick' },
      { x: 1380, y: 190, w: 110, h: 36, type: 'crusher', origY: 190, vy: 0, triggered: false },
      { x: 1670, y: groundY - 65, w: 85, h: 115, type: 'brick' },
      { x: 1820, y: groundY - 120, w: 85, h: 170, type: 'brick' },
      { x: 1970, y: groundY - 175, w: 90, h: 225, type: 'brick' },
      { x: 2130, y: groundY - 125, w: 90, h: 175, type: 'brick' },
      { x: 2300, y: groundY, w: 300, h: 50, type: 'ground' },
      { x: 2680, y: groundY - 100, w: 65, h: 20, type: 'falling', origY: groundY - 100, vy: 0, triggered: false },
      { x: 2840, y: groundY - 160, w: 65, h: 20, type: 'brick' },
      { x: 3000, y: groundY - 220, w: 65, h: 20, type: 'falling', origY: groundY - 220, vy: 0, triggered: false },
      { x: 3180, y: groundY, w: 250, h: 50, type: 'ground' },
      { x: 3480, y: groundY, w: 320, h: 50, type: 'ground' }
    ];

    const spikes = [
      { x: 345, y: 600, w: 40, h: 35 },
      { x: 1765, y: groundY, w: 45, h: 28 },
      { x: 1915, y: groundY, w: 45, h: 28 },
      { x: 2070, y: groundY, w: 50, h: 28 },
      { x: 3435, y: groundY, w: 40, h: 30 }
    ];

    const cannons = [
      { x: 1560, y: groundY - 32, interval: 3.8, timer: 0.5, dir: -1, speed: 140 },
      { x: 2600, y: groundY - 40, interval: 3.0, timer: 1.0, dir: -1, speed: 210 }
    ];
    let projectiles = [];

    const enemies = [
      { x: 460, y: groundY, vx: -50, minX: 410, maxX: 540, vy: 0, jumping: false, alive: true },
      { x: 1220, y: groundY, vx: -120, minX: 950, maxX: 1280, vy: 0, jumping: false, alive: true },
      { x: 3240, y: groundY, vx: -140, minX: 3190, maxX: 3380, vy: 0, jumping: true, alive: true }
    ];

    const coins = [
      { x: 280, y: groundY - 40, w: 20, h: 20, active: true, phase: 0 },
      { x: 690, y: 340, w: 20, h: 20, active: true, phase: 1 },
      { x: 1140, y: groundY - 140, w: 20, h: 20, active: true, phase: 2 },
      { x: 2010, y: groundY - 250, w: 20, h: 20, active: true, phase: 3 }
    ];

    const realFlag = { x: 3680, y: groundY - 220, w: 18, h: 220 };
    let particles = [];

    function addParticles(x, y, color, count=5) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 160,
          vy: (Math.random() - 0.5) * 120,
          life: 0.3 + Math.random() * 0.2,
          maxLife: 0.5,
          color
        });
      }
    }

    // Input States
    const keys = {};
    window.addEventListener('keydown', e => {
      initAudio();
      keys[e.code] = true;
      if ((gameOver || gameWon) && e.code === 'KeyR') resetGame();
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // Registros de toque precisos para celular (Corrige o problema de "passar o dedo")[cite: 1.2.3, 1.2.5]
    function bindTouchBtn(id, code) {
      const el = document.getElementById(id);
      
      const touchStart = e => {
        e.preventDefault();
        initAudio();
        keys[code] = true;
        el.classList.add('pressed');
      };

      const touchEnd = e => {
        e.preventDefault();
        keys[code] = false;
        el.classList.remove('pressed');
      };

      el.addEventListener('touchstart', touchStart, { passive: false });
      el.addEventListener('touchend', touchEnd, { passive: false });
      el.addEventListener('touchcancel', touchEnd, { passive: false });

      // Suporte fallback para clique/mouse
      el.addEventListener('mousedown', () => { keys[code] = true; });
      el.addEventListener('mouseup', () => { keys[code] = false; });
      el.addEventListener('mouseleave', () => { keys[code] = false; });
    }

    bindTouchBtn('btn-left', 'ArrowLeft');
    bindTouchBtn('btn-right', 'ArrowRight');
    bindTouchBtn('btn-down', 'ArrowDown');
    bindTouchBtn('btn-jump', 'ArrowUp');
    bindTouchBtn('btn-space', 'Space');

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      initAudio();
      if (gameOver || gameWon) resetGame();
    }, { passive: false });

    function resetGame() {
      playerX = 70; playerY = groundY; playerVx = 0; playerVy = 0;
      cameraX = 0; isGrounded = true; coyoteTimer = 0;
      isCrouching = false; isFacingFront = false;
      deathRotation = 0; deathTimer = 0;
      gameOver = false; gameWon = false;
      projectiles = []; particles = [];

      platforms.forEach(p => {
        if (p.type === 'falling' || p.type === 'crusher') {
          p.y = p.origY; p.vy = 0; p.triggered = false;
        }
      });
      enemies.forEach(e => { e.alive = true; e.vy = 0; });
      coins.forEach(c => c.active = true);
    }

    function triggerDeath() {
      if (!gameOver && !gameWon) {
        gameOver = true;
        deathCount++;
        sfxTrap();
        addParticles(playerX, playerY - 24, '#e74c3c', 20);
        playerVy = -480;
        isGrounded = false;
      }
    }

    // Loop Principal
    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.03);
      lastTime = now;

      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      particles.forEach(p => {
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      });
      particles = particles.filter(p => p.life > 0);

      cannons.forEach(c => {
        c.timer += dt;
        if (c.timer >= c.interval) {
          c.timer = 0;
          if (Math.abs(c.x - playerX) < 650) {
            projectiles.push({ x: c.x, y: c.y, vx: c.dir * c.speed, r: 8 });
            sfxShoot();
          }
        }
      });

      projectiles.forEach(p => p.x += p.vx * dt);
      projectiles = projectiles.filter(p => p.x >= 0 && p.x <= LEVEL_WIDTH);

      platforms.forEach(p => {
        if (p.type === 'falling' && p.triggered) {
          p.vy += GRAVITY * dt * 1.8;
          p.y += p.vy * dt;
        } else if (p.type === 'crusher') {
          if (!p.triggered && Math.abs(playerX - (p.x + p.w / 2)) < 65) {
            p.triggered = true; sfxTrap();
          }
          if (p.triggered && p.y + p.h < groundY) {
            p.vy += GRAVITY * dt * 2.2;
            p.y += p.vy * dt;
          }
        }
      });

      enemies.forEach(e => {
        if (!e.alive) return;
        if (e.jumping) {
          e.vy += GRAVITY * dt;
          e.y += e.vy * dt;
          if (e.y >= groundY) { e.y = groundY; e.vy = 0; }
        }
        e.x += e.vx * dt;
        if (e.x <= e.minX || e.x >= e.maxX) e.vx *= -1;
      });

      if (gameOver) {
        deathTimer += dt;
        deathRotation += 7.0 * dt;
        playerVy += GRAVITY * dt * 0.9;
        playerY += playerVy * dt;
        return;
      }
      if (gameWon) return;

      isCrouching = (keys['ArrowDown'] || keys['KeyS']) && isGrounded;
      isFacingFront = !!keys['Space'];

      let moveDir = 0;
      if (!isCrouching) {
        if (keys['ArrowLeft'] || keys['KeyA']) moveDir -= 1;
        if (keys['ArrowRight'] || keys['KeyD']) moveDir += 1;
      }

      if (moveDir !== 0) {
        playerVx += moveDir * ACCEL * dt;
        playerVx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, playerVx));
        facingRight = moveDir > 0;
      } else {
        if (playerVx > 0) playerVx = Math.max(0, playerVx - FRICTION * ACCEL * dt);
        else if (playerVx < 0) playerVx = Math.min(0, playerVx + FRICTION * ACCEL * dt);
      }

      if ((keys['ArrowUp'] || keys['KeyW']) && !isCrouching) {
        if (isGrounded || coyoteTimer > 0) {
          playerVy = JUMP_STRENGTH;
          isGrounded = false;
          coyoteTimer = 0;
          sfxJump();
          addParticles(playerX, playerY, '#bdc3c7', 6);
        }
      }

      const isMoving = Math.abs(playerVx) > 10;
      walkTimer += (isMoving && isGrounded && !isCrouching) ? 10 * dt : 0;

      playerX += playerVx * dt;
      playerX = Math.max(15, Math.min(LEVEL_WIDTH - 15, playerX));

      cameraX += ((playerX - 400) - cameraX) * (12.0 * dt);
      cameraX = Math.max(0, Math.min(LEVEL_WIDTH - 800, cameraX));

      playerVy += GRAVITY * dt;
      playerY += playerVy * dt;

      const boxH = isCrouching ? 26 : 52;
      const pRect = { x: playerX - 12, y: playerY - boxH, w: 24, h: boxH };
      isGrounded = false;

      if (checkRect(pRect, realFlag)) {
        gameWon = true; return;
      }

      platforms.forEach(p => {
        if (checkRect(pRect, p)) {
          if (p.type === 'crusher' && p.triggered && p.vy > 80) {
            triggerDeath(); return;
          }
          const prevBottom = (pRect.y + pRect.h) - (playerVy * dt);
          if (playerVy > 0 && prevBottom <= p.y + 16) {
            playerY = p.y;
            playerVy = 0;
            isGrounded = true;
            coyoteTimer = 0.08;
            if (p.type === 'falling') p.triggered = true;
          } else if (playerVy < 0 && pRect.y - (playerVy * dt) >= p.y + p.h - 10) {
            playerY = p.y + p.h + boxH;
            playerVy = 40;
          }
        }
      });

      spikes.forEach(s => {
        if (checkRect(pRect, { x: s.x, y: s.y - s.h, w: s.w, h: s.h })) triggerDeath();
      });

      projectiles.forEach(pr => {
        if (checkRect(pRect, { x: pr.x - pr.r, y: pr.y - pr.r, w: pr.r * 2, h: pr.r * 2 })) triggerDeath();
      });

      enemies.forEach(e => {
        if (!e.alive) return;
        const eRect = { x: e.x - 14, y: e.y - 28, w: 28, h: 28 };
        if (checkRect(pRect, eRect)) {
          if (playerVy > 0 && (pRect.y + pRect.h - (playerVy * dt)) <= eRect.y + 12) {
            e.alive = false;
            playerVy = JUMP_STRENGTH / 1.3;
            sfxStomp();
            addParticles(e.x, e.y - 14, '#e74c3c', 12);
          } else {
            triggerDeath();
          }
        }
      });

      coins.forEach(c => {
        c.phase += 4.0 * dt;
        if (c.active && checkRect(pRect, c)) {
          c.active = false;
          coinsCollected++;
          sfxCoin();
        }
      });

      if (playerY > 660) triggerDeath();
    }

    function checkRect(r1, r2) {
      return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
    }

    // --- Renderização ---
    function render() {
      ctx.clearRect(0, 0, 800, 600);
      const cam = Math.floor(cameraX);

      const grad = ctx.createLinearGradient(0, 0, 0, 600);
      grad.addColorStop(0, '#120a16'); grad.addColorStop(1, '#260c14');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 800, 600);

      ctx.strokeStyle = '#221820';
      ctx.lineWidth = 1;
      for (let y = 60; y < 600; y += 22) {
        const shift = Math.floor(y / 22) % 2 * 22;
        for (let x = - (cam % 44) + shift - 44; x < 844; x += 44) {
          ctx.strokeRect(x, y, 42, 20);
        }
      }

      ctx.fillStyle = '#e67e22'; ctx.fillRect(0, groundY + 35, 800, 50);
      ctx.fillStyle = '#f39c12'; ctx.fillRect(0, groundY + 35, 800, 6);

      platforms.forEach(p => {
        const dx = p.x - cam;
        if (dx + p.w < 0 || dx > 800) return;
        ctx.fillStyle = p.type === 'ground' ? '#2c2c34' : '#3d3a45';
        ctx.fillRect(dx, p.y, p.w, p.h);
        ctx.fillStyle = '#53505f';
        ctx.fillRect(dx, p.y, p.w, 4);
        ctx.strokeStyle = '#18171d';
        ctx.strokeRect(dx, p.y, p.w, p.h);

        if (p.type === 'crusher') {
          ctx.fillStyle = '#95a5a6';
          for (let tx = dx; tx < dx + p.w; tx += 18) {
            ctx.beginPath();
            ctx.moveTo(tx, p.y + p.h);
            ctx.lineTo(tx + 9, p.y + p.h + 8);
            ctx.lineTo(tx + 18, p.y + p.h);
            ctx.fill();
          }
        }
      });

      ctx.fillStyle = '#95a5a6';
      spikes.forEach(s => {
        const sx = s.x - cam;
        ctx.beginPath();
        ctx.moveTo(sx, s.y);
        ctx.lineTo(sx + s.w / 2, s.y - s.h);
        ctx.lineTo(sx + s.w, s.y);
        ctx.fill();
      });

      cannons.forEach(c => {
        const cx = c.x - cam;
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(cx - 15, c.y - 15, 30, 30);
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(cx + (c.dir * 12), c.y, 7, 0, Math.PI * 2);
        ctx.fill();
      });

      projectiles.forEach(pr => {
        ctx.beginPath();
        ctx.arc(pr.x - cam, pr.y, pr.r, 0, Math.PI * 2);
        ctx.fill();
      });

      enemies.forEach(e => {
        if (!e.alive) return;
        const ex = e.x - cam;
        ctx.fillStyle = e.jumping ? '#e58e8e' : '#ecf0f1';
        ctx.beginPath();
        ctx.arc(ex, e.y - 14, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(ex - 6, e.y - 17, 3, 3);
        ctx.fillRect(ex + 3, e.y - 17, 3, 3);
      });

      coins.forEach(c => {
        if (!c.active) return;
        const cx = c.x - cam + 10;
        const scale = Math.abs(Math.cos(c.phase));
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.ellipse(cx, c.y + 10, Math.max(3, 9 * scale), 10, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      const fx = realFlag.x - cam;
      ctx.fillStyle = '#bdc3c7'; ctx.fillRect(fx, realFlag.y, realFlag.w, realFlag.h);
      ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(fx + 9, realFlag.y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#27ae60';
      ctx.beginPath();
      ctx.moveTo(fx - 40, realFlag.y + 10);
      ctx.lineTo(fx, realFlag.y + 30);
      ctx.lineTo(fx - 40, realFlag.y + 50);
      ctx.fill();

      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - cam, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      drawSnoop(ctx, playerX - cam, playerY);

      ctx.fillStyle = 'rgba(15, 10, 20, 0.8)';
      ctx.fillRect(15, 15, 260, 42);
      ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 20px Arial';
      ctx.fillText(`Mortes: ${deathCount}`, 25, 42);
      ctx.fillStyle = '#f1c40f';
      ctx.fillText(`Moedas: ${coinsCollected}`, 150, 42);

      if (gameWon) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, 800, 600);
        ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 48px Arial'; ctx.textAlign = 'center';
        ctx.fillText('SNOOP VENCEU!', 400, 260);
        ctx.fillStyle = '#fff'; ctx.font = '24px Arial';
        ctx.fillText('Toque na tela para reiniciar', 400, 320);
        ctx.textAlign = 'start';
      } else if (gameOver && deathTimer > 1.0) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, 800, 600);
        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 48px Arial'; ctx.textAlign = 'center';
        ctx.fillText('DERROTADO!', 400, 260);
        ctx.fillStyle = '#fff'; ctx.font = '24px Arial';
        ctx.fillText('Toque na tela para tentar de novo', 400, 320);
        ctx.textAlign = 'start';
      }
    }

    function drawSnoop(c, px, py) {
      c.save();
      c.translate(px, py);
      if (gameOver) c.rotate(deathRotation);

      const dir = facingRight ? 1 : -1;
      const legSwing = Math.sin(walkTimer) * 8;

      if (isFacingFront) {
        c.fillStyle = '#1e3820';
        c.fillRect(-6, -24, 5, 24); c.fillRect(1, -24, 5, 24);
        c.fillStyle = '#27ae60'; c.fillRect(-10, -42, 20, 18);
        c.fillStyle = '#fff'; c.fillRect(-1, -42, 2, 18);
        c.fillStyle = '#8a5634'; c.beginPath(); c.arc(0, -50, 6, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#111'; c.fillRect(-7, -52, 14, 4);
        c.strokeStyle = '#181212'; c.lineWidth = 3;
        c.beginPath(); c.moveTo(-6, -50); c.lineTo(-8, -32); c.stroke();
        c.beginPath(); c.moveTo(6, -50); c.lineTo(8, -32); c.stroke();
      } else if (isCrouching) {
        c.fillStyle = '#1e3820';
        c.fillRect(-4 * dir, -14, 14 * dir, 14);
        c.fillStyle = '#27ae60';
        c.fillRect(-6 * dir, -24, 14 * dir, 12);
        c.fillStyle = '#8a5634';
        c.beginPath(); c.arc(4 * dir, -28, 6, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#111'; c.fillRect(2 * dir, -30, 7 * dir, 4);
      } else {
        c.strokeStyle = '#162818'; c.lineWidth = 4;
        c.beginPath(); c.moveTo(0, -22); c.lineTo(-legSwing * dir, 0); c.stroke();
        c.strokeStyle = '#234426';
        c.beginPath(); c.moveTo(0, -22); c.lineTo(legSwing * dir, 0); c.stroke();

        c.fillStyle = '#27ae60';
        c.fillRect(-6, -38, 12, 16);
        c.fillStyle = '#fff'; c.fillRect(-1, -38, 2, 16);
        c.strokeStyle = '#f1c40f'; c.lineWidth = 2;
        c.beginPath(); c.arc(0, -36, 4, 0, Math.PI); c.stroke();

        c.fillStyle = '#8a5634';
        c.beginPath(); c.arc(dir * 2, -45, 6, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#111';
        c.fillRect(dir * 2, -47, 7 * dir, 4);

        c.strokeStyle = '#181212'; c.lineWidth = 3;
        c.beginPath();
        c.moveTo(0, -45);
        c.lineTo(-6 * dir - (legSwing * 0.4), -30);
        c.stroke();
      }
      c.restore();
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
